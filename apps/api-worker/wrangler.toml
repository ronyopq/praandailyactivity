name = "smart-work-tracker-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
workers_dev = true

[vars]
APP_ORIGIN = "http://localhost:3000"
API_ORIGIN = "http://127.0.0.1:8787"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"

[[d1_databases]]
binding = "DB"
database_name = "praandailyactivity_db"
database_id = "c20e6942-e60d-479e-9bcd-81e11d6f0073"
migrations_dir = "../../db/migrations"

[[kv_namespaces]]
binding = "FILES_KV"
id = "93b480ee39354eb8a2bd8537eb0720e9"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[env.production.vars]
APP_ORIGIN = "https://praandailyactivity.pages.dev"
API_ORIGIN = "https://smart-work-tracker-api-production.ronybd.workers.dev"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"

[[env.production.d1_databases]]
binding = "DB"
database_name = "praandailyactivity_db"
database_id = "c20e6942-e60d-479e-9bcd-81e11d6f0073"
migrations_dir = "../../db/migrations"

[[env.production.kv_namespaces]]
binding = "FILES_KV"
id = "93b480ee39354eb8a2bd8537eb0720e9"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"
